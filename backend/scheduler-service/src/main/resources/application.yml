server:
  port: 8086

spring:
  application:
    name: scheduler-service
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

account:
  service:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8083}

product:
  service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}

transaction:
  service:
    url: ${TRANSACTION_SERVICE_URL:http://localhost:8084}

app:
  fee:
    cron: "0 0 1 * * *"
    amount: 5.00
    topic: APPLY_MONTHLY_FEE_EVENT

logging:
  level:
    com.bankofgeorgia: DEBUG
