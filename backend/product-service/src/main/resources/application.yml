server:
  port: 8082

spring:
  application:
    name: product-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/bankofgeorgia
      # Build @Indexed / @CompoundIndex constraints (incl. the unique code and
      # name+type indexes). Off by default in Spring Data Mongo 3+.
      auto-index-creation: true

logging:
  level:
    com.bankofgeorgia: DEBUG
