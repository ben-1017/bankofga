name: CI

on:
  push:
    branches: [main, development]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — Maven build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build & test all services
        working-directory: backend
        run: mvn -B -T1C test

  frontend:
    name: Frontend — build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin-ui, customer-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: Install
        working-directory: frontend/${{ matrix.app }}
        run: npm ci
      - name: Build
        working-directory: frontend/${{ matrix.app }}
        run: npm run build

  integration:
    name: Integration — docker-compose + Newman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: infra/integration-tests/package-lock.json
      - name: Start full stack
        run: docker compose -f infra/docker/docker-compose.yml up -d --build
      - name: Install Newman runner
        working-directory: infra/integration-tests
        run: npm ci
      - name: Wait for services + run Postman suite
        working-directory: infra/integration-tests
        run: npm run ci
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs --no-color --tail=300
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-junit
          path: infra/integration-tests/reports/junit.xml
          if-no-files-found: warn
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v
