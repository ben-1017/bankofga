services:
  mongodb:
    image: mongo:7
    container_name: bog-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bankofgeorgia
    volumes:
      - mongo-data:/data/db
      - ../mongo:/docker-entrypoint-initdb.d:ro
    networks:
      - bog-net

  mongo-express:
    image: mongo-express:1.0.2
    container_name: bog-mongo-express
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    networks:
      - bog-net

  redis:
    image: redis:7-alpine
    container_name: bog-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - bog-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: bog-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bog-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: bog-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - bog-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bog-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bog-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - bog-net

  customer-service:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: customer-service
    container_name: bog-customer-service
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8181:8181"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/bankofgeorgia
    networks:
      - bog-net

  product-service:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: product-service
    container_name: bog-product-service
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/bankofgeorgia
    networks:
      - bog-net

  account-service:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: account-service
    container_name: bog-account-service
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8083:8083"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/bankofgeorgia
    networks:
      - bog-net

  transaction-service:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: transaction-service
    container_name: bog-transaction-service
    restart: unless-stopped
    depends_on:
      - mongodb
      - account-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/bankofgeorgia
      ACCOUNT_SERVICE_URL: http://account-service:8083
    networks:
      - bog-net

  notification-service:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
    container_name: bog-notification-service
    restart: unless-stopped
    depends_on:
      - mongodb
      - kafka
    ports:
      - "8085:8085"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/bankofgeorgia
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CUSTOMER_SERVICE_URL: http://customer-service:8181
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM: ${SENDGRID_FROM:-no-reply@bankofgeorgia.dev}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
    networks:
      - bog-net

  scheduler-service:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: scheduler-service
    container_name: bog-scheduler-service
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8086:8086"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - bog-net

volumes:
  mongo-data:
  redis-data:

networks:
  bog-net:
    driver: bridge
